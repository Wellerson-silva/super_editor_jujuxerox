<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Super Editor - Jujuxerox</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #4a90e2; }
        form { margin-top: 20px; }
        .images { display: flex; gap: 20px; margin-top: 20px; }
        .image-box { text-align: center; }
        img { max-width: 250px; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄🖼️ Super Editor - Flask</h1>
        <p>Envie uma imagem e escolha uma operação:</p>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required><br><br>
            
            <label>Ação:</label>
            <select name="acao">
                <option value="pb">Preto e Branco</option>
                <option value="espelhar">Espelhar Imagem</option>
            </select><br><br>
            
            <button type="submit">Processar Imagem</button>
        </form>

        {% if original and editado %}
            <div class="images">
                <div class="image-box">
                    <h3>Original</h3>
                    <img src="{{ url_for('static', filename='uploads/' + original) }}" alt="Original">
                </div>
                <div class="image-box">
                    <h3>Editado</h3>
                    <img src="{{ url_for('static', filename='uploads/' + editado) }}" alt="Editado">
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
