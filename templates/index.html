<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor | Jujuxerox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="workspace">
        
        
        <!-- Barra Lateral Esquerda -->
        <aside class="sidebar-left">
            <!-- Container que organiza os botões das ferramentas em coluna -->
            <div class="sidebar-tools">
                <!-- Botão de Crop (Cortar) -->
                <button id="cropBtn" class="tool-btn" title="Cortar Imagem / Documento">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path>
                        <path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Área Central com a folha A4 -->
        <div class="canvas-container" id="canvasContainer">
            <div class="zoom-wrapper" id="zoomWrapper">
                <div class="a4-sheet">
                    <span class="sheet-label">Jujuxerox | A4</span>
                </div>
            </div>
        </div>

        <!-- Indicador de Zoom -->
        <div class="zoom-indicator" id="zoomIndicator">Zoom: 100%</div>
    </div>

    <!-- BOTÃO FLUTUANTE DE DOWNLOAD (Canto Superior Direito) -->
    <div class="floating-download-container">
        <button id="downloadButton" class="download-btn" title="Baixar arquivo">
            Baixar
        </button>
    </div>

    <!-- BOTÃO FLUTUANTE DE UPLOAD (Canto Direito) -->
    <div class="floating-upload-container">
        <label for="fileUploadInput" id="uploadButtonLabel" class="upload-btn">
            Enviar arquivo
        </label>
        <input type="file" id="fileUploadInput" style="display: none;" />
    </div>

    <script src="{{ url_for('static', filename='javascript.js') }}"></script>
</body>
</html>
